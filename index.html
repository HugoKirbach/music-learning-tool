<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BeatForge — Entraînement à la composition</title>
  <meta name="description" content="Sessions de 5-10 minutes pour apprendre à composer rythmes, accords, mélodies et sons, puis les transposer dans Ableton Live 12, MPC Key 37 et Serum 2.">
  <meta name="theme-color" content="#0d0d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BeatForge">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Écran de démarrage : visible avant le chargement des scripts, retiré au premier affichage */
    #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0d0d16; color: #ececf6; font: 700 22px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity .35s; }
    #splash .logo { font-size: 56px; color: #b388ff; animation: splash-pulse 1.2s ease-in-out infinite; }
    #splash small { font-weight: 400; font-size: 14px; color: #9a9ab8; }
    #splash.gone { opacity: 0; pointer-events: none; }
    @keyframes splash-pulse { 50% { transform: scale(1.12); opacity: .75; } }
    @media (prefers-reduced-motion: reduce) { #splash .logo { animation: none; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><span class="logo">◆</span>BeatForge<small>Entraînement à la composition</small></div>
  <header id="status" class="status"></header>
  <main id="view" class="view"></main>
  <div id="miniplayer" class="mini" hidden></div>
  <nav id="nav" class="nav"></nav>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts"></div>
  <noscript>BeatForge a besoin de JavaScript.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
